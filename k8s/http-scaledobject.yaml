apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: checkout-http
  namespace: checkout
spec:
  scaleTargetRef:
    name: checkout
    kind: Deployment
    service: checkout
    port: 4000
  replicas:
    min: 0
    max: 5
  scaledownPeriod: 30
  hosts:
    - checkout.checkout.svc.cluster.local
